config:
  golangci-lint:
    linters:
      settings:
        gosec:
          excludes: { add: [G204] }   # subprocess command names are internal constants (git, gh, the binary), never user input

# Soft-finding baselines: how many non-gating findings this repository
# currently carries, per rule. This is a RATCHET — the counts may only fall.
# Exceeding one fails the build and names the rule; a rule absent here is
# permitted zero. Raising a number is a deliberate, reviewable decision.
#
# yze/invariant and yze/filesize are permanent probes (judgment-bound).
# yze/errtest, yze/errtested and yze/testfile are HARD rules softened only
# for rollout: they were structurally inert until the suite driver began
# loading test files, and return to gating once their counts reach zero.
# `soft:` is what makes a rule non-gating; `soft-baseline:` is only the
# per-rule ceiling APPLIED TO the rules named here. A baseline without a
# matching soft entry is inert — the rule stays hard and fails on its first
# finding whatever number is recorded beside it.
soft:
  # `add` MERGES with the global soft list; a plain sequence would REPLACE
  # it and silently harden every centrally-softened rule in this repo.
  add:
    - yze/clidomain
    - exhaustive
    - yze/errtest
    - yze/errtested
    - yze/filesize
    - yze/invariant
    - yze/testfile

soft-baseline:
  # Ratcheted 2026-08-03 against stickler v0.10.7 / yze v0.31.9: exhaustive,
  # errtest, errtested, invariant and testfile were adjudicated and closed at
  # source, so each is now the measured count and gates on its first new
  # finding. filesize and fuzzreq are the two rules still carrying findings —
  # they await the source splits and the fuzz target that close them, and
  # neither may rise.
  exhaustive: 0
  yze/errtest: 0
  yze/errtested: 0
  yze/filesize: 4
  yze/fuzzreq: 1
  yze/invariant: 0
  yze/testfile: 0
