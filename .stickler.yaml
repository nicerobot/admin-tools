config:
  golangci-lint:
    linters:
      settings:
        gosec:
          excludes: { add: [G204] }   # subprocess command names are internal constants (git, gh, the binary), never user input

# Soft-finding baselines: the number of non-gating findings this repository
# currently carries, per rule. This is a RATCHET — the counts may only fall.
# Raising one is a deliberate, reviewable decision; lowering one is progress.
# A rule absent here is permitted zero.
soft-baseline:
  yze/filesize: 4
  yze/invariant: 11
