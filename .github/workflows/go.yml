# Managed by nicerobot/tools.repository (distribute-build)
name: go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    # A scheduled run re-validates against the floating ci/go@v2 tool image, the
    # latest Go patch, and the current CVE database with no push. distribute
    # substitutes the per-repo cron above; the guard skips forks (and is a no-op
    # for push / pull_request, whose event name is never "schedule").
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/go@v2.6.1

  # Early warning, NOT a gate. The `go` job above is the gate, and it pins the
  # toolchain via the ci/go@v2 image so every repo compiles identically. This job
  # runs the same tests against Go tip on the schedule only, so a stdlib
  # behavior change lands as a notification weeks before the next minor makes it
  # a fleet-wide breakage. It is allowed to fail by design — tip breaks for
  # reasons that are not ours — so it must never block a push or a merge.
  #
  # This is the ONLY place continue-on-error is legitimate in this workflow:
  # putting it on the real gate would silence findings, which is forbidden.
  go-next:
    if: github.event_name == 'schedule' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
      - run: go test -shuffle=on ./...
