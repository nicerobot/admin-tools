# Managed by nicerobot/tools.repository (distribute-build)
name: docs
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.mdx"
      - ".markdownlint*"
      - ".prettierrc*"
      - ".standards.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - "**.mdx"
      - ".markdownlint*"
      - ".prettierrc*"
      - ".standards.yaml"
      - ".github/workflows/docs.yml"
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  docs:
    # A scheduled run re-lints against the floating ci/docs@v2 image with no push;
    # distribute substitutes the per-repo cron above. Skip forks (no-op for push/PR).
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/docs@v2
