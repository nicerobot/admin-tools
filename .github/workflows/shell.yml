# Managed by nicerobot/tools.repository (distribute-build)
name: shell
on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - "**.bash"
      - "**/bin/**"
      - "**/scripts/**"
      - "**/hooks/**"
      - "**/check"
      - ".shellcheckrc"
      - ".editorconfig"
      - ".standards.yaml"
      - ".github/workflows/shell.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.sh"
      - "**.bash"
      - "**/bin/**"
      - "**/scripts/**"
      - "**/hooks/**"
      - "**/check"
      - ".shellcheckrc"
      - ".editorconfig"
      - ".standards.yaml"
      - ".github/workflows/shell.yml"
  workflow_dispatch:
concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  shell:
    # A scheduled run re-lints against the floating ci/shell@v2 image with no push;
    # distribute substitutes the per-repo cron above. Skip forks (no-op for push/PR).
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/shell@v2
